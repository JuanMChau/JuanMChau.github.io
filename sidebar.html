<!DOCTYPE html>
<html lang="en">
<head>
<script>
  (function () {
    try {
      if (localStorage.getItem("theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) {}
  })();
</script>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* This file is loaded inside an <iframe>, so it only needs to fill
     its own box — the outer sizing/position/slide-in behavior all
     live in the parent page's .sidebar CSS rule, applied to the
     <iframe> element itself. */
  html, body { height: 100%; margin: 0; background: var(--paper); }
  body { padding: 48px 32px; box-sizing: border-box; overflow-y: auto; }
  @media (max-width: 780px) {
    body { padding: 32px 24px; }
  }
</style>
</head>
<body>

  <img class="avatar" src="images/face.jpg" alt="[Your Name]"></div>
  <h1>Juan M. Chau Delgado</h1>
  <p class="role">Psychology PhD, University of Nottingham</p>

  <div class="swatch-motif" aria-hidden="true">
    <div class="swatch-pair p1"><span></span><span></span></div>
    <div class="swatch-pair p2"><span></span><span></span></div>
    <div class="swatch-pair p3"><span></span><span></span></div>
  </div>

  <ul class="links">
    <li><a href="mailto:juan.m.chau@gmail.com">Email</a></li>
    <li><a href="https://github.com/JuanMChau" target="_blank" rel="noopener noreferrer">GitHub</a></li>

  <nav class="primary-nav" aria-label="Primary">
    <ul>
      <li><a href="index.html" target="_top" id="nav-home">Home</a></li>
      <li><a href="publications.html" target="_top" id="nav-pubs">Publications</a></li>
      <li><a href="cv.html" target="_top" id="nav-cv">CV</a></li>
    </ul>
  </nav>

  <button class="theme-toggle" type="button" id="theme-toggle">
    <span class="dot" aria-hidden="true"></span>
    <span class="label">Switch to light</span>
  </button>

<script>
  // Which nav link is "current" is passed in via the iframe's own URL
  // (?active=home / publications / cv), set once per page below.
  var params = new URLSearchParams(window.location.search);
  var navIds = { home: "nav-home", publications: "nav-pubs", cv: "nav-cv" };
  var el = document.getElementById(navIds[params.get("active")]);
  if (el) el.setAttribute("aria-current", "page");

  // Theme toggle lives inside this document, but needs to repaint the
  // whole site (this frame + the page around it), so it updates
  // localStorage and reloads the top-level page. Both documents read
  // the same key on load, so they end up in sync.
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var root = document.documentElement;
    var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    try { localStorage.setItem("theme", next); } catch (e) {}
    if (window.top && window.top !== window) {
      window.top.location.reload();
    }
  });
</script>
</body>
</html>
